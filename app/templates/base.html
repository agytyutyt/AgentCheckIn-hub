<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<div class="layout">
  <aside class="side">
    <div class="brand"><span class="dot"></span>{{ app_name }}</div>

    <a class="nav-item {{ 'active' if active=='dashboard' }}" href="/dashboard">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      总览
    </a>
    <a class="nav-item {{ 'active' if active=='accounts' }}" href="/accounts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.5" r="2.6"/><path d="M2.8 13.4c.7-2.4 2.7-3.6 5.2-3.6s4.5 1.2 5.2 3.6"/></svg>
      账号
    </a>
    <a class="nav-item {{ 'active' if active=='tasks' }}" href="/tasks">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></svg>
      任务与调度
    </a>
    <a class="nav-item {{ 'active' if active=='runs' }}" href="/runs">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg>
      运行记录
    </a>
    <a class="nav-item {{ 'active' if active=='logs' }}" href="/logs">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M6 8h4M6 10.5h4"/></svg>
      日志
    </a>
    <a class="nav-item {{ 'active' if active=='settings' }}" href="/settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg>
      设置
    </a>

    <div class="side-foot">
      v{{ version }} · {{ tz }}<br>
      <span class="faint">{{ now }}</span><br>
      <a href="/logout">退出登录</a>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
{% block anon %}{% endblock %}
{% endif %}

<div id="toast"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>

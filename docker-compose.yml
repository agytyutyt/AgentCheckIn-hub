services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        PIP_INDEX: ${PIP_INDEX:-https://mirrors.cloud.tencent.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.cloud.tencent.com}
    image: checkin-hub:latest
    container_name: checkinhub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8000"
      CHECKIN_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: checkinhub-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 填了域名 → 自动申请证书走 HTTPS；留空 → 纯 HTTP(:80)
      SITE_ADDR: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
